name: Publish to GitHub Pages

# GitHub Pages 的发布源为 gh-pages 分支（仓库根目录即站点根目录）。
# 本工作流不构建、不打包、不安装依赖，只在 main 有更新时把同一份文件同步到 gh-pages。
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 同步 main 到 gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
