name: Deploy to GitHub Pages

# 仅用于把仓库里的静态文件发布到 GitHub Pages，不参与应用构建：
# 应用本身是无构建的纯静态站点，本工作流不做任何打包、转译或依赖安装。
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
